name: FocusGuard Android app

on:
  push:
    paths:
      - "focus-app/**"
      - ".github/workflows/focus-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: focus-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk FocusGuard.apk
          cp feed/build/outputs/apk/release/feed-release.apk FocusFeed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            focus-app/FocusGuard.apk
            focus-app/FocusFeed.apk

      - name: Publish release (download link for the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: focusguard-build-${{ github.run_number }}
          name: FocusGuard 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            focus-app/FocusGuard.apk
            focus-app/FocusFeed.apk
          body: |
            **FocusFeed.apk** — Инстаграм без лишнего (сайт внутри приложения).
            **FocusGuard.apk** — ограничитель для официального приложения Инстаграма.
            Новые версии ставятся поверх старых.
            Branch: ${{ github.ref_name }}, commit ${{ github.sha }}
